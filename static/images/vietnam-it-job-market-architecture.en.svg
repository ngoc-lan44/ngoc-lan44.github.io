<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#546a86" stroke-width="1.5"/></marker><style>text{font-family:Arial,sans-serif;fill:#16334f}.title{font-size:28px;font-weight:bold}.h{font-size:20px;font-weight:bold}.b{font-size:16px}.small{font-size:14px}.card{fill:white;stroke:#bdd0e5;stroke-width:2}.line{fill:none;stroke:#546a86;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1100" height="680" fill="#f3f7fc"/><text x="45" y="50" class="title">CloudDocs · Target deployment architecture</text><text x="45" y="82" class="b">EC2/RDS: verify environment · S3/Cognito: integrated in code</text><rect x="360" y="235" width="690" height="315" rx="20" fill="#e8eff9" stroke="#9fb7d3" stroke-dasharray="8 6"/><text x="385" y="265" class="small">VPC · RDS accepts authorized connections only</text><rect class="card" x="50" y="305" width="245" height="125" rx="14"/><text x="75" y="341" class="h">Browser</text><text x="75" y="373" class="b">Frontend HTML/CSS/JS</text><text x="75" y="401" class="small">Access token + PKCE</text><rect class="card" x="400" y="300" width="285" height="145" rx="14"/><text x="425" y="337" class="h">EC2 · Nginx</text><text x="425" y="370" class="b">Spring Boot REST API</text><text x="425" y="400" class="small">JWT · permissions · quota · audit</text><text x="425" y="425" class="small">IAM instance role for S3</text><rect class="card" x="780" y="310" width="230" height="125" rx="14"/><text x="805" y="347" class="h">RDS MySQL</text><text x="805" y="380" class="b">Metadata + permissions</text><text x="805" y="410" class="small">Users · audit · work tasks</text><rect class="card" x="80" y="125" width="295" height="100" rx="14"/><text x="105" y="163" class="h">Amazon Cognito</text><text x="105" y="198" class="b">User Pool · authentication</text><rect class="card" x="705" y="125" width="305" height="100" rx="14"/><text x="730" y="163" class="h">Amazon S3 private</text><text x="730" y="198" class="b">Files · signed PUT / GET</text><path class="line" d="M170 303 L170 227"/><path class="line" d="M296 368 L397 368"/><text x="310" y="348" class="small">HTTPS</text><path class="line" d="M687 368 L776 368"/><text x="700" y="348" class="small">TLS</text><path class="line" d="M580 300 L580 175 L703 175"/><text x="591" y="278" class="small">Sign URL / HEAD</text><path class="line" d="M285 305 L420 245 L706 215"/><text x="430" y="216" class="small">Direct file transfer</text><text x="48" y="600" class="b">Backend checks permissions before issuing URLs; MySQL does not store file contents.</text><text x="48" y="630" class="b">Cognito authenticates identities; backend manages permissions and business data.</text></svg>